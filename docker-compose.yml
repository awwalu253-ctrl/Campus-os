services:
  db:
    image: postgis/postgis:16-3.4
    container_name: campusos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusos
      POSTGRES_DB: campusos
    ports:
      - "5432:5432"
    volumes:
      - campusos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - campusos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: campusos-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://campusos:campusos@db:5432/campusos
      TEST_DATABASE_URL: postgresql+psycopg://campusos:campusos@db:5432/campusos_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FLASK_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    command: >
      sh -c "
        flask db upgrade &&
        python run.py
      "

volumes:
  campusos_pgdata:
  campusos_redisdata: