services:
  - type: web
    name: campus-os
    runtime: python
    plan: free                    # <-- free, no card
    region: oregon
    buildCommand: "pip install -r requirements.txt && python -m scripts.enable_postgis && flask db upgrade"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-os-db
          property: connectionString
      - key: MAPBOX_TOKEN
        sync: false
      - key: POSTGIS_ENABLED
        value: "true"
      - key: RATELIMIT_ENABLED
        value: "false"
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: CELERY_RESULT_BACKEND
        value: "cache+memory://"

databases:
  - name: campus-os-db
    plan: free                    # <-- free, no card
    region: oregon
    postgresMajorVersion: "16"