{% extends "layouts/auth.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="muted">Sign in to continue to Campus OS.</p>

<form method="post" novalidate class="form">
  {{ form.hidden_tag() }}

  <label class="form__field">
    <span>{{ form.email.label.text }}</span>
    {{ form.email(autocomplete="email", inputmode="email", placeholder="you@example.com") }}
    {% for e in form.email.errors %}<small class="form__error">{{ e }}</small>{% endfor %}
  </label>

  <label class="form__field">
    <span>{{ form.password.label.text }}</span>
    {{ form.password(autocomplete="current-password", placeholder="Your password") }}
    {% for e in form.password.errors %}<small class="form__error">{{ e }}</small>{% endfor %}
  </label>

  <div class="row row--between" style="align-items: center;">
    <label class="form__check" style="margin: 0;">
      {{ form.remember() }}
      <span>Keep me signed in</span>
    </label>
    <a href="{{ url_for('auth.forgot') }}" style="font-size: var(--fs-sm); font-weight: 600;">Forgot?</a>
  </div>

  {{ form.submit(class="btn btn--primary btn--block btn--lg") }}
</form>

<p class="muted" style="margin-top: var(--sp-5); text-align: center; font-size: var(--fs-sm);">
  New here?
  <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Create an account</a>
</p>
{% endblock %}
