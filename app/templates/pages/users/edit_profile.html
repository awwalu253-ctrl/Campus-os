{% extends "layouts/app_shell.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}

<h1 style="font-size: var(--fs-2xl);">Edit profile</h1>
<p class="muted" style="margin-bottom: var(--sp-5);">Update your personal information.</p>

<section class="card card--pad-lg">
  <form method="post" novalidate class="form">
    {{ form.hidden_tag() }}

    <label class="form__field">
      <span>{{ form.display_name.label.text }}</span>
      {{ form.display_name() }}
      {% for e in form.display_name.errors %}<small class="form__error">{{ e }}</small>{% endfor %}
    </label>

    <label class="form__field">
      <span>{{ form.phone.label.text }}</span>
      {{ form.phone(placeholder="+234 800 000 0000") }}
      {% for e in form.phone.errors %}<small class="form__error">{{ e }}</small>{% endfor %}
    </label>

    <div class="row" style="gap: var(--sp-2);">
      <a class="btn btn--ghost" href="{{ url_for('users.profile') }}">Cancel</a>
      {{ form.submit(class="btn btn--primary") }}
    </div>
  </form>
</section>

{% endblock %}
