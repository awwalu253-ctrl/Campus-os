{% extends "layouts/auth.html" %}
{% block title %}Choose your programme{% endblock %}
{% block content %}
<h1>Your programme</h1>

<form method="post" action="{{ url_for('universities.set_programme') }}" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label class="form__field">
    <span>Programme</span>
    <select name="programme_id" required>
      <option value="" disabled selected>Select your programme</option>
      {% for p in programmes %}
        <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </label>

  <button type="submit" class="btn btn--primary btn--block">Continue</button>
</form>
{% endblock %}
