{% extends "base.html" %}
{% block body_class %}page-landing{% endblock %}
{% block body %}
<main class="landing">
  <header class="landing__hero">
    <h1>{{ BRAND.tagline }}</h1>
    <p>Discover what's happening around campus, find places and services,
       stay organized, and make student life easier.</p>
    <div class="landing__cta">
      <a class="btn btn--primary" href="{{ url_for('auth.register') }}">Explore Campus OS</a>
      <a class="btn btn--ghost" href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </header>
</main>
{% endblock %}
