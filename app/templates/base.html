<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17233F">
  <title>{% block title %}Campus OS{% endblock %} · {{ BRAND.name }}</title>
  <meta name="description" content="{{ BRAND.tagline }}">

  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/onboarding.css') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/landing.css') }}">
  {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/pwa/install.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/pwa/splash.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>

</html>
